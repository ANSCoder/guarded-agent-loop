[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guarded-agent-loop"
version = "0.1.0"
description = "A small agent runtime with step caps, per-tool policy, and a trace for every step."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "httpx>=0.27",
    "mcp>=2,<3",
    "pydantic-settings>=2.4",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff==0.17.2",
]

[project.scripts]
agent-runtime = "agent_runtime.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_runtime"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]
